<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espresso 1:2</title>
<meta name="description" content="Carnet de shots d'espresso et conseils pour viser un ratio 1:2.">
<meta name="theme-color" content="#3b2418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- Couleurs (clair / sombre automatique) ---------- */
:root {
  --bg: #f6efe6; --surface: #fffaf3; --surface2: #efe3d3; --line: #e2d3c0;
  --text: #2b1d14; --muted: #7a6656; --accent: #7b4a2a; --accent-ink: #fff;
  --good: #2f7d4f; --good-bg: #dcefe2; --warn: #b8650f; --warn-bg: #f8e6cf;
  --bad: #b3412f; --zone: #bfe0c9; --track: #e8dccb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16100c; --surface: #221913; --surface2: #2f241c; --line: #3c2f25;
    --text: #f3e7d8; --muted: #b29c88; --accent: #d9a671; --accent-ink: #1d130c;
    --good: #67c48f; --good-bg: #1d3326; --warn: #eaa452; --warn-bg: #3a2914;
    --bad: #e8806e; --zone: #2c5039; --track: #3a2e25;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- En-tête ---------- */
header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
header h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: .2px; }
.iconbtn { border: 0; background: none; color: inherit; font-size: 22px; line-height: 1; padding: 6px 4px; cursor: pointer; }
dialog select { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }

main { padding: 12px 16px 24px; max-width: 560px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 8px; }

/* ---------- Cartes "meilleur réglage" ---------- */
.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px 12px; padding: 0 16px 4px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.best {
  flex: 0 0 82%; scroll-snap-align: start; text-align: left; border: 1px solid var(--line);
  background: var(--surface); border-radius: 18px; padding: 12px 14px;
}
.best.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.best h3 { margin: 0 0 2px; font-size: 16px; }
.best .reco { font-size: 15px; margin: 6px 0; }
.best .reco b { font-size: 17px; }
.best .stats { display: flex; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spark .t { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.spark svg { display: block; width: 100%; height: 34px; }

/* ---------- Puces café ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 999px;
  padding: 10px 14px; font-size: 15px; min-height: 44px;
}
.chip.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip.add { background: none; border-style: dashed; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 8px 0 0; font-size: 14px; }

/* ---------- Steppers ---------- */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row + .row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.row .name { font-weight: 600; }
.row .sub { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button, .bigstep {
  width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--surface2);
  font-size: 28px; line-height: 1; user-select: none; -webkit-user-select: none;
}
.stepper button:active, .bigstep:active { background: var(--line); }
.stepper .val { min-width: 84px; text-align: center; white-space: nowrap; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .val small { font-size: 14px; font-weight: 500; color: var(--muted); }

.timebox { display: flex; align-items: center; justify-content: space-between; }
.bigstep { width: 68px; height: 68px; border-radius: 50%; }
.bignum { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; }
.bignum small { font-size: 22px; font-weight: 600; color: var(--muted); }
input[type=range] { width: 100%; margin: 16px 0 2px; accent-color: var(--accent); height: 32px; }
.rangescale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.liveratio { text-align: center; font-size: 15px; margin-top: 12px; color: var(--muted); }
.liveratio b { color: var(--text); font-size: 18px; }

.taste { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.taste button {
  min-height: 60px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface2);
  font-size: 16px; font-weight: 600;
}
.taste button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
textarea, input[type=text], input[type=date] {
  width: 100%; font: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; resize: vertical;
}
.savebar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); padding-top: 6px; z-index: 5; }
.primary {
  width: 100%; min-height: 60px; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  font-size: 18px; font-weight: 700; box-shadow: 0 6px 18px rgb(0 0 0 / .18);
}
.primary:active { transform: scale(.99); }
.secondary {
  width: 100%; min-height: 52px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface2);
  font-size: 16px; font-weight: 600;
}
.danger { color: var(--bad); }
.primary.danger { background: var(--bad); color: #fff; }
.banner { background: var(--warn-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.banner .secondary { margin-top: 10px; }
.tip { font-size: 13px; color: var(--muted); text-align: center; padding: 8px 8px 0; }

/* ---------- Onglets ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { border: 0; background: none; height: 64px; font-size: 15px; font-weight: 600; color: var(--muted); }
nav.tabs button span { display: block; font-size: 20px; line-height: 1.1; }
nav.tabs button.sel { color: var(--accent); }

/* ---------- Historique ---------- */
.histhead { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.histhead .chips { flex: 1; }
.shot { padding: 12px 14px; }
.shot .top { display: flex; justify-content: space-between; gap: 8px; }
.shot .top b { font-size: 16px; }
.shot .vals { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.shot .note { font-style: italic; color: var(--muted); font-size: 14px; margin-top: 4px; }
.shot .acts { display: flex; gap: 8px; margin-top: 8px; }
.shot .acts button { flex: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-size: 14px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }
.welcome { flex: 1 0 100%; margin: 0; } .welcome h3 { margin: 0 0 6px; } .welcome p { margin: 6px 0; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }

/* ---------- Résultat ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
.overlay .inner { max-width: 560px; margin: 0 auto; }
.overlay h2 { margin: 4px 0 12px; font-size: 22px; }
.metric { display: flex; justify-content: space-between; align-items: baseline; }
.metric .v { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.status { font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.status.ok { color: var(--good); background: var(--good-bg); }
.status.warn { color: var(--warn); background: var(--warn-bg); }
.gauge { position: relative; height: 14px; border-radius: 7px; background: var(--track); margin: 10px 0 4px; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: var(--zone); border-radius: 7px; }
.gauge .mark { position: absolute; top: -5px; width: 8px; height: 24px; margin-left: -4px; border-radius: 4px; border: 2px solid var(--surface); }
.gauge .mark.ok { background: var(--good); } .gauge .mark.warn { background: var(--warn); }
.gscale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.onlyone { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px; }
.advice { counter-reset: a; list-style: none; padding: 0; margin: 0; }
.advice li { position: relative; padding: 0 0 12px 36px; }
.advice li + li { padding-top: 12px; border-top: 1px solid var(--line); }
.advice li::before {
  counter-increment: a; content: counter(a); position: absolute; left: 0; width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface2); text-align: center; line-height: 26px; font-weight: 700; font-size: 14px;
}
.advice li + li::before { top: 12px; }
.advice b { display: block; }
.advice .tag { font-size: 12px; color: var(--muted); }
.recipe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 12px; }
.recipe div { background: var(--surface2); border-radius: 12px; padding: 10px 4px; }
.recipe b { display: block; font-size: 20px; }
.recipe span { font-size: 12px; color: var(--muted); }

/* ---------- Dialogues / toast ---------- */
dialog {
  border: 0; border-radius: 22px; padding: 18px; width: min(92vw, 440px); background: var(--surface); color: var(--text);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog h3 { margin: 0 0 10px; font-size: 18px; }
dialog .btns { display: flex; gap: 8px; margin-top: 16px; }
#tabHist .btns { display: flex; gap: 8px; } #tabHist .btns button { flex: 1; }
dialog .btns button { flex: 1; }
dialog .field { margin-top: 12px; }
dialog .field > div:first-child { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
dialog ul { padding-left: 20px; margin: 6px 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>Espresso 1:2</h1>
  <button id="settingsBtn" class="iconbtn" data-i18n-aria="settings">⚙</button>
</header>

<!-- ============ Onglet Shot ============ -->
<main id="tabShot">
  <div id="carousel" class="carousel"></div>

  <div id="editBanner" class="banner hidden">
    <span data-i18n-html="editingPre"></span> <span id="editWhen"></span>
    <button class="secondary" id="cancelEdit" data-i18n="cancelEdit"></button>
  </div>

  <section class="card">
    <p class="label" data-i18n="coffee"></p>
    <div id="cafeChips" class="chips"></div>
    <button id="editCafeBtn" class="linkbtn"></button>
  </section>

  <section class="card">
    <div class="row">
      <div><div class="name" data-i18n="dose"></div><div class="sub" data-i18n="doseSub"></div></div>
      <div class="stepper"><button data-step="dose:-1" data-i18n-aria="less">−</button><div class="val" id="vDose"></div><button data-step="dose:1" data-i18n-aria="more">+</button></div>
    </div>
    <div class="row">
      <div><div class="name" data-i18n="grinder"></div><div class="sub" id="vTours"></div></div>
      <div class="stepper"><button data-step="clics:-1" data-i18n-aria="less">−</button><div class="val" id="vClics"></div><button data-step="clics:1" data-i18n-aria="more">+</button></div>
    </div>
  </section>

  <section class="card">
    <p class="label" data-i18n="extTime"></p>
    <div class="timebox">
      <button class="bigstep" data-step="temps:-1" data-i18n-aria="lessSec">−</button>
      <div class="bignum" id="vTemps"></div>
      <button class="bigstep" data-step="temps:1" data-i18n-aria="moreSec">+</button>
    </div>
    <input type="range" id="tempsRange" min="10" max="60" step="1" data-i18n-aria="extTime">
    <div class="rangescale"><span>10 s</span><span data-i18n="target2530"></span><span>60 s</span></div>
  </section>

  <section class="card">
    <div class="row">
      <div><div class="name" data-i18n="inCup"></div><div class="sub" data-i18n="inCupSub"></div></div>
      <div class="stepper"><button data-step="tasse:-1" data-i18n-aria="less">−</button><div class="val" id="vTasse"></div><button data-step="tasse:1" data-i18n-aria="more">+</button></div>
    </div>
    <div class="liveratio"><span data-i18n="ratio"></span> <b id="vRatio"></b> <span id="vRatioHint"></span></div>
  </section>

  <section class="card">
    <p class="label"><span data-i18n="taste"></span> <span class="muted" style="text-transform:none;letter-spacing:0" data-i18n="optional"></span></p>
    <div class="taste" id="tasteBtns">
      <button data-gout="acide" data-i18n="sour"></button>
      <button data-gout="équilibré" data-i18n="balanced"></button>
      <button data-gout="amer" data-i18n="bitter"></button>
    </div>
    <p class="label" style="margin-top:14px"><span data-i18n="note"></span> <span class="muted" style="text-transform:none;letter-spacing:0" data-i18n="optional"></span></p>
    <textarea id="note" rows="2" data-i18n-ph="notePh"></textarea>
  </section>

  <div class="savebar"><button class="primary" id="saveBtn"></button></div>
  <p class="tip" id="formTip"></p>
</main>

<!-- ============ Onglet Historique ============ -->
<main id="tabHist" class="hidden">
  <div class="histhead">
    <div class="chips" id="histFilter"></div>
  </div>
  <div class="btns" style="margin-bottom:12px">
    <button class="secondary" id="csvBtn" data-i18n="exportCsv"></button>
    <button class="secondary" id="csvImportBtn" data-i18n="importCsv"></button>
  </div>
  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <div id="histList"></div>
</main>

<nav class="tabs">
  <button id="tabBtnShot" class="sel"><span>☕</span><b data-i18n="tabShot" style="font-weight:inherit"></b></button>
  <button id="tabBtnHist"><span>☰</span><b data-i18n="tabHist" style="font-weight:inherit"></b></button>
</nav>

<!-- ============ Résultat après enregistrement ============ -->
<div id="result" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="resultAria">
  <div class="inner" id="resultInner"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast"></div>

const pickLang = () => { for (const l of navigator.languages || [navigator.language || 'en']) { const k = String(l).slice(0, 2).toLowerCase(); if (I18N[k]) return k; } return 'en'; };
let LANG = 'en';
const pr = (n) => { try { return new Intl.PluralRules(LANG).select(n); } catch { return n === 1 ? 'one' : 'other'; } };
function t(key, p = {}) {
  let v = I18N[LANG][key] ?? I18N.en[key] ?? key;
  if (v && typeof v === 'object' && !Array.isArray(v)) v = v[pr(p.n ?? 0)] ?? v.other;
  return typeof v === 'string' ? v.replace(/\{(\w+)\}/g, (m, k) => (k in p ? p[k] : m)) : v;
}
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelector('meta[name="description"]').content = t('appDesc');
  document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((e) => { e.innerHTML = t(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach((e) => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-ph]').forEach((e) => { e.placeholder = t(e.dataset.i18nPh); });
}

/* =====================================================================
   1. Constantes (tout est stocké sur le téléphone, rien n'est envoyé ailleurs)
   ===================================================================== */
const HEADER = ['id', 'date', 'heure', 'cafe', 'torrefaction', 'dose_g', 'tasse_g', 'ratio', 'temps_s', 'clics_k6', 'gout', 'note']; // colonnes de l'export CSV
const TIME_LO = 25, TIME_HI = 30;
const PREINF = 6; // secondes approximatives avant les premières gouttes (sert à estimer le temps à 1:2)

/* =====================================================================
   2. Stockage local (sur le téléphone)
   ===================================================================== */
const load = (k, d) => { try { const v = localStorage.getItem('esx.' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('esx.' + k, JSON.stringify(v)); } catch {} };

let shots = load('shots', []);
// Liste des cafés : vide pour un nouvel utilisateur. Si elle n'a jamais été enregistrée
// mais qu'il existe des shots, on la reconstruit à partir des shots (aucune donnée perdue).
let cafes = load('cafes', null) || [...new Map(shots.map((s) => [s.cafe, { nom: s.cafe, torrefaction: s.torrefaction || 'moyenne', date: '' }])).values()];
let next = load('next', {});         // "prochaine recette" par café
let S = load('settings', { cafe: '', tipIdx: 0 });
LANG = I18N[S.lang] ? S.lang : pickLang();
const saveAll = () => { save('cafes', cafes); save('shots', shots); save('next', next); save('settings', S); };

/* =====================================================================
   3. Petits utilitaires
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const fr = (n, d = 1) => { const x = Number(n).toFixed(d); return ['fr', 'es'].includes(LANG) ? x.replace('.', ',') : x; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const ratioOf = (s) => (s.dose > 0 ? s.tasse / s.dose : 0);
const sortKey = (s) => `${s.date} ${s.heure}`;
const tours = (c) => { const n = Math.floor(c / 60), r = c % 60; return t('turns', { n, t: n, r }); };
const clk = (c) => `${c} ${t('clicks', { n: c })}`;
const dateFr = (d) => (d ? new Date(d + 'T12:00').toLocaleDateString(LANG, { day: '2-digit', month: '2-digit' }) : '');
const roastLabel = { claire: 'claire', moyenne: 'moyenne', foncee: 'foncée' }; // valeurs stockées (internes)
const roastName = (r) => t('roast_' + (norm(r) || 'moyenne'));
const goutKey = { acide: 'sour', equilibre: 'balanced', amer: 'bitter' };
const goutName = (g) => (goutKey[norm(g)] ? t(goutKey[norm(g)]) : g);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

// Cible de ratio selon la torréfaction
function profile(roast) {
  const r = norm(roast);
  if (r === 'claire') return { lo: 1.8, hi: 2.5, target: 2.0, light: true };
  if (r === 'foncee') return { lo: 1.8, hi: 2.0, target: 1.9, dark: true };
  return { lo: 1.8, hi: 2.2, target: 2.0 };
}
const cafeByName = (n) => cafes.find((c) => c.nom === n);
const roastOf = (shot) => shot.torrefaction || cafeByName(shot.cafe)?.torrefaction || 'moyenne';
const inTarget = (s) => { const p = profile(roastOf(s)), R = ratioOf(s); return R >= p.lo && R <= p.hi && s.temps >= TIME_LO && s.temps <= TIME_HI; };
const shotsOf = (cafe) => shots.filter((s) => s.cafe === cafe).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

/* =====================================================================
   4. Formulaire de saisie
   ===================================================================== */
const F = { cafe: '', dose: 180, clics: 30, temps: 28, tasse: 36, gout: '', note: '' }; // dose en dixièmes de gramme
let editingId = null;

function prefill(cafe) {
  F.cafe = cafe; S.cafe = cafe;
  const rec = next[cafe];
  const last = shotsOf(cafe).at(-1);
  const src = rec || last;
  if (src) {
    F.dose = Math.round(src.dose * 10); F.clics = src.clics; F.tasse = Math.round(src.tasse);
    F.temps = rec ? 28 : src.temps;
  } else { F.dose = 180; F.clics = 30; F.temps = 28; F.tasse = 36; }
  F.gout = ''; F.note = ''; $('note').value = '';
  save('settings', S);
}

function step(field, dir) {
  if (field === 'dose') { F.dose = clamp(F.dose + dir, 0, 300); F.tasse = Math.round(F.dose / 10 * 2); }
  if (field === 'clics') F.clics = clamp(F.clics + dir, 0, 180);
  if (field === 'temps') F.temps = clamp(F.temps + dir, 1, 120);
  if (field === 'tasse') F.tasse = clamp(F.tasse + dir, 0, 150);
  renderForm();
}

// Appui long = défilement rapide (qui accélère)
function bindRepeat(btn, fn) {
  let t; const stop = () => clearTimeout(t);
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); fn(); let delay = 350;
    const loop = () => { fn(); delay = Math.max(30, delay * 0.75); t = setTimeout(loop, delay); };
    t = setTimeout(loop, delay);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('click', (e) => { if (e.detail === 0) fn(); }); // clavier
}

function renderForm() {
  $('cafeChips').innerHTML = cafes.map((c) =>
    `<button class="chip ${c.nom === F.cafe ? 'sel' : ''}" data-cafe="${esc(c.nom)}">${esc(c.nom)}</button>`).join('') +
    `<button class="chip add" id="addCafe">${t('addCoffee')}</button>`;
  $('editCafeBtn').classList.toggle('hidden', !cafeByName(F.cafe));
  $('editCafeBtn').textContent = t('editNamed', { n: F.cafe });
  $('vDose').innerHTML = `${fr(F.dose / 10)}<small> g</small>`;
  $('vClics').innerHTML = `${F.clics}<small> ${t('clicks', { n: F.clics })}</small>`;
  $('vTours').textContent = `${tours(F.clics)} · ${F.clics * 16} µm`;
  $('vTemps').innerHTML = `${F.temps}<small> s</small>`;
  $('tempsRange').value = clamp(F.temps, 10, 60);
  $('vTasse').innerHTML = `${F.tasse}<small> g</small>`;
  const R = F.dose ? F.tasse / (F.dose / 10) : 0;
  $('vRatio').textContent = F.dose ? `1:${fr(R)}` : '—';
  const p = profile(cafeByName(F.cafe)?.torrefaction);
  $('vRatioHint').textContent = F.dose ? (R >= p.lo && R <= p.hi ? '✓' : t('targetRange', { lo: fr(p.lo), hi: fr(p.hi) })) : '';
  document.querySelectorAll('#tasteBtns button').forEach((b) => b.classList.toggle('sel', b.dataset.gout === F.gout));
  $('saveBtn').textContent = editingId ? t('saveEdit') : t('saveShot');
  $('editBanner').classList.toggle('hidden', !editingId);
}

/* ---------- Ajout / modification d'un café ---------- */
function cafeDialog(existing) {
  const c = existing || { nom: '', torrefaction: 'moyenne', date: '' };
  let roast = norm(c.torrefaction) || 'moyenne';
  const d = $('dlg');
  d.innerHTML = `
    <h3>${existing ? t('editCoffeeT') : t('newCoffee')}</h3>
    <div class="field"><div>${t('name')}</div><input type="text" id="cNom" value="${esc(c.nom)}" autocomplete="off"></div>
    <div class="field"><div>${t('roast')}</div>
      <div class="taste" id="cRoast">${['claire', 'moyenne', 'foncee'].map((r) => `<button type="button" data-r="${r}">${roastName(r)}</button>`).join('')}</div></div>
    <div class="field"><div>${t('roastDate')}</div><input type="date" id="cDate" value="${esc(c.date)}"></div>
    <div class="btns"><button class="secondary" id="cCancel">${t('cancel')}</button><button class="primary" id="cOk">${t('save')}</button></div>
    ${existing ? `<div class="btns"><button class="secondary danger" id="cDel">${t('deleteCoffee')}</button></div>` : ''}`;
  const paint = () => d.querySelectorAll('#cRoast button').forEach((b) => b.classList.toggle('sel', b.dataset.r === roast));
  d.querySelectorAll('#cRoast button').forEach((b) => b.onclick = () => { roast = b.dataset.r; paint(); });
  paint();
  $('cCancel').onclick = () => d.close();
  $('cOk').onclick = () => {
    const nom = $('cNom').value.trim();
    if (!nom) return toast(t('needName'));
    if (cafes.some((x) => x.nom === nom && x !== existing)) return toast(t('coffeeExists'));
    const item = { nom, torrefaction: roastLabel[roast], date: $('cDate').value };
    if (existing) {
      const old = existing.nom;
      Object.assign(existing, item);
      if (old !== nom) { // on renomme aussi les shots de ce café
        shots.filter((s) => s.cafe === old).forEach((s) => { s.cafe = nom; });
        if (next[old]) { next[nom] = next[old]; delete next[old]; }
        if (F.cafe === old) F.cafe = S.cafe = nom;
      }
    } else { cafes.push(item); prefill(nom); }
    saveAll(); d.close(); renderAll();
  };
  if (existing) $('cDel').onclick = async () => {
    d.close();
    if (!(await ask({ title: t('deleteCoffeeQ', { n: esc(existing.nom) }), body: t('deleteCoffeeBody'), ok: t('delete'), danger: true }))) return;
    cafes = cafes.filter((x) => x !== existing);
    if (F.cafe === existing.nom) prefill(cafes[0]?.nom || '');
    saveAll(); renderAll();
  };
  d.showModal();
}

/* ---------- Dialogue de confirmation ---------- */
function ask({ title, body = '', ok = t('confirm'), cancel = t('cancel'), danger = false }) {
  return new Promise((res) => {
    const d = $('dlg');
    d.innerHTML = `<h3>${title}</h3><div>${body}</div>
      <div class="btns">${cancel ? `<button class="secondary" id="aNo">${cancel}</button>` : ''}<button class="primary ${danger ? 'danger' : ''}" id="aOk">${ok}</button></div>`;
    const done = (v) => { d.onclose = null; d.close(); res(v); };
    $('aOk').onclick = () => done(true);
    if (cancel) $('aNo').onclick = () => done(false);
    d.onclose = () => res(false);
    d.showModal();
  });
}

/* ---------- Enregistrement ---------- */
async function onSave() {
  if (!F.cafe) return ask({ title: t('chooseCoffee'), body: t('chooseCoffeeBody'), ok: t('ok'), cancel: '' });
  const dose = F.dose / 10;
  if (dose <= 0) return ask({ title: t('dose0'), body: t('dose0Body'), ok: t('ok'), cancel: '' });
  const R = F.tasse / dose, issues = [];
  if (R < 1) issues.push(t('ratioBelow1', { r: fr(R) }));
  if (R > 4) issues.push(t('ratioAbove4', { r: fr(R) }));
  if (F.temps > 60) issues.push(t('timeAbove60', { t: F.temps }));
  if (issues.length && !(await ask({ title: t('confirmQ'), body: `<ul>${issues.map((i) => `<li>${i}</li>`).join('')}</ul>${t('unusual')}`, ok: t('yesSave') }))) return;

  const cafe = cafeByName(F.cafe);
  const data = { cafe: F.cafe, torrefaction: cafe?.torrefaction || '', dose, tasse: F.tasse, temps: F.temps, clics: F.clics, gout: F.gout, note: $('note').value.trim() };

  if (editingId) {
    const s = shots.find((x) => String(x.id) === String(editingId));
    if (s) Object.assign(s, data);
    editingId = null; saveAll(); prefill(F.cafe); renderAll();
    toast(t('shotEdited')); showTab('hist');
    return;
  }
  const shot = { id: nextId(), date: today(), heure: nowHM(), ...data };
  const prev = shotsOf(F.cafe);
  shots.push(shot);
  delete next[F.cafe];
  saveAll();
  showResult(shot, prev);
  F.gout = ''; $('note').value = ''; renderAll();
}

/* =====================================================================
   5. Moteur de conseils
   ===================================================================== */
function analyze(shot, prev) {
  const T = window.__t;
  const roast = roastOf(shot), P = profile(roast);
  const d = shot.dose, y = shot.tasse, t = shot.temps, c = shot.clics, R = y / d;
  const targetY = Math.round(d * P.target);
  const ratioOk = R >= P.lo && R <= P.hi;
  const choked = (t >= 30 && R < 1.2) || (t > 35 && R < 1.5);
  const out = [];
  let grind = null; // conseil de mouture principal

  // Temps "équivalent" : si le poids est loin de la cible, on estime la durée qu'aurait eue le shot à la cible
  let tt = t, est = false;
  if (!choked && !ratioOk && y > 0) { tt = Math.round(PREINF + (t - PREINF) * targetY / y); est = true; }
  const when = est ? T('whenEst', { tt, ty: targetY, y, t }) : `${t} s`;

  if (choked) {
    const dl = R < 1 ? 4 : 3;
    grind = { prio: 1, param: 'grind', delta: dl, title: T('chokedT'), text: T('chokedX', { y, t, c: c + dl }) };
  } else if (tt < 22) {
    const dl = tt < 18 ? -3 : -2;
    grind = { prio: 2, param: 'grind', delta: dl, title: T('fastT', { w: when }), text: T('fastX', { c: c + dl }) };
  } else if (tt < TIME_LO) {
    grind = { prio: 2, param: 'grind', delta: -1, title: T('sfastT', { w: when }), text: T('sfastX', { c: c - 1 }) };
  } else if (tt > 35) {
    const dl = tt > 40 ? 3 : 2;
    grind = { prio: 2, param: 'grind', delta: dl, title: T('slowT', { w: when }), text: T('slowX', { c: c + dl }) };
  } else if (tt > TIME_HI) {
    grind = { prio: 2, param: 'grind', delta: 1, title: T('sslowT', { w: when }), text: T('sslowX', { c: c + 1 }) };
  }
  if (grind && P.light && grind.delta < 0) grind.text += T('lightFine');
  if (grind && P.dark && grind.delta > 0) grind.text += T('darkCoarse');
  if (grind) out.push(grind);

  // Rendement (poids en tasse)
  let yieldAdv = null;
  if (!choked && R > P.hi) yieldAdv = { prio: 3, param: 'yield', title: T('longT', { r: fr(R) }), text: T('longX', { y: targetY }) };
  if (!choked && R < P.lo) yieldAdv = { prio: 3, param: 'yield', title: T('shortT', { r: fr(R) }), text: T('shortX', { y: targetY }) };
  if (yieldAdv) out.push(yieldAdv);

  const timeOk = t >= TIME_LO && t <= TIME_HI;
  // Goût
  if (shot.gout && norm(shot.gout) === 'acide') {
    if (timeOk && ratioOk) out.push({ prio: 4, param: 'temp', title: T('sourOkT'), text: T('sourOkX') });
    else if (grind && grind.delta < 0) grind.text += T('alsoSour');
    else if (yieldAdv && R < P.lo) yieldAdv.text += T('alsoSourY');
    else if (!grind && !yieldAdv) {
      const longY = P.light ? Math.round(d * 2.4) : targetY + 2;
      out.push({ prio: 4, param: 'grind', delta: -1, title: T('underT'),
        text: T('underX', { c: c - 1, y: longY }) + (P.light ? T('lightOk', { a: fr(2.3), b: fr(2.5) }) : '') });
    }
  }
  if (shot.gout && norm(shot.gout) === 'amer') {
    if (timeOk && ratioOk) out.push({ prio: 4, param: 'temp', title: T('bitterOkT'), text: T('bitterOkX') });
    else if (grind && grind.delta > 0) grind.text += T('alsoBitter');
    else if (yieldAdv && R > P.hi) yieldAdv.text += T('alsoBitterY');
    else if (!grind && !yieldAdv) {
      const shortY = P.dark ? Math.round(d * 1.8) : targetY - 2;
      out.push({ prio: 4, param: 'grind', delta: 1, title: T('overT'),
        text: T('overX', { c: c + 1, y: shortY }) + (P.dark ? T('darkAim', { a: fr(1.8), b: fr(2.0) }) : '') });
    }
  }

  // Régularité : même réglage, temps très différents → préparation du gâteau
  const eq = (s) => { const r = ratioOf(s); return r >= P.lo && r <= P.hi ? s.temps : Math.round(PREINF + (s.temps - PREINF) * targetY / s.tasse); };
  const same = prev.filter((s) => s.clics === c && Math.abs(s.dose - d) <= 0.3 && s.tasse > 0 && !((s.temps >= 30 && ratioOf(s) < 1.2))).slice(-2);
  let inconsistent = false;
  if (same.length && !choked) {
    const times = [...same.map(eq), tt];
    if (Math.max(...times) - Math.min(...times) >= 6) {
      inconsistent = true;
      out.push({ prio: 5, param: 'prep', title: T('inconsT'), text: T('inconsX', { c, times: times.map((x) => x + ' s').join(', ') }) });
    }
  }

  const success = !choked && timeOk && ratioOk && (!shot.gout || norm(shot.gout) === 'equilibre');
  if (success) out.unshift({ prio: 0, param: null, title: T('successT'), text: shot.gout ? T('successBal') : T('successTaste') });

  out.sort((a, b) => a.prio - b.prio);
  const list = out.slice(0, 3);
  const main = list.find((a) => a.param);
  const recipe = { dose: d, clics: c, tasse: targetY };
  if (main && main.delta) recipe.clics = clamp(c + main.delta, 0, 180);
  return { R, P, ratioOk, timeOk, tt, est, list, main, recipe, inconsistent, yieldOff: !!yieldAdv };
}

const TIPS = { get length() { return t('tips').length; } };
const tip = (i) => t('tips')[i];
function pickTip(shot, a) {
  const c = cafeByName(shot?.cafe);
  if (c?.date) {
    const age = Math.floor((Date.now() - new Date(c.date + 'T12:00')) / 864e5);
    if (age >= 0 && age < 7) return t('young', { n: age });
    if (age > 30) return t('old', { n: age });
  }
  if (a && norm(shot.gout) === 'amer') return tip(2);
  if (a && a.inconsistent) return tip(3);
  S.tipIdx = ((S.tipIdx || 0) + 1) % TIPS.length; save('settings', S);
  return tip(S.tipIdx);
}

function gauge(v, min, max, lo, hi, ok) {

    <div class="mark ${ok ? 'ok' : 'warn'}" style="left:${p(v)}%"></div></div>`;
}

/* =====================================================================
   6. Accueil : meilleur réglage + mini-stats par café
   ===================================================================== */
function bestOf(list) {
  const dist = (s) => Math.abs(ratioOf(s) - 2);
  const bal = list.filter((s) => norm(s.gout) === 'equilibre');
  const pool = bal.length ? bal : list.filter((s) => s.temps >= TIME_LO && s.temps <= TIME_HI && ratioOf(s) >= 1.5 && ratioOf(s) <= 2.6);
  return pool.sort((a, b) => dist(a) - dist(b))[0];
}
function spark(vals, lo, hi, band) {
  if (vals.length < 2) return '<svg viewBox="0 0 100 34"></svg>';
  const min = Math.min(lo, ...vals), max = Math.max(hi, ...vals), span = max - min || 1;
  const x = (i) => 4 + i * 92 / (vals.length - 1), y = (v) => 30 - (v - min) / span * 26;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const b = band ? `<rect x="0" width="100" y="${y(band[1]).toFixed(1)}" height="${(y(band[0]) - y(band[1])).toFixed(1)}" fill="var(--zone)" opacity=".7"/>` : '';
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none">${b}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function renderStats() {
  const html = cafes.map((c) => {
    const list = shotsOf(c.nom);
    const n = list.length, ok = list.filter(inTarget).length;
    const b = bestOf(list.slice());
    const last = list.slice(-15);
    const P = profile(c.torrefaction);
    return `<button class="best ${c.nom === F.cafe ? 'sel' : ''}" data-best="${esc(c.nom)}">
      <h3>${esc(c.nom)}</h3>
      <div class="muted small">${t('best')}${b ? t('tapApply') : ''}</div>
      <div class="reco">${b ? `<b>${clk(b.clics)}</b> · ${fr(b.dose)} g → ${Math.round(b.tasse)} g · ${b.temps} s` : `<span class="muted">${t('noRef')}</span>`}</div>
      <div class="stats"><span>${t('nShots', { n })}</span><span>${t('pctTarget', { p: n ? Math.round(ok / n * 100) : 0 })}</span></div>
      <div class="sparks">
        <div class="spark"><div class="t"><span>${t('clicks', { n: 2 })}</span><span>${last.at(-1)?.clics ?? ''}</span></div>${spark(last.map((s) => s.clics), last.at(-1)?.clics - 2 || 0, last.at(-1)?.clics + 2 || 1)}</div>
        <div class="spark"><div class="t"><span>${t('ratio')}</span><span>${last.length ? '1:' + fr(ratioOf(last.at(-1))) : ''}</span></div>${spark(last.map((s) => clamp(ratioOf(s), 0.5, 4)), 1.5, 2.5, [P.lo, P.hi])}</div>
      </div></button>`;
  }).join('');
  $('carousel').innerHTML = html || `<div class="card welcome"><h3>${t('welcomeT')}</h3>
    <p>${t('welcomeX')}</p>
    <p class="muted small">${t('welcomeNote')}</p></div>`;
}

function startEdit(id) {

  F.gout = Object.keys(goutKey).includes(norm(s.gout)) ? { acide: 'acide', equilibre: 'équilibré', amer: 'amer' }[norm(s.gout)] : '';

async function delShot(id) {
  const s = shots.find((x) => String(x.id) === String(id)); if (!s) return;
  if (!(await ask({ title: t('deleteShotQ'), body: `${esc(s.cafe)} · ${dateFr(s.date)} ${esc(s.heure)}`, ok: t('delete'), danger: true }))) return;
  shots = shots.filter((x) => x !== s); saveAll(); renderAll();
}

function exportCsv() {
  const q = (v) => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = shots.slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b))).map((s) => toRow(s).map(q).join(','));
  const csv = '﻿' + [HEADER.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `espresso-shots-${today()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =====================================================================
   8. Identifiants, export et import CSV
   ===================================================================== */
const nextId = () => String(Math.max(0, ...shots.map((s) => parseInt(s.id, 10)).filter((n) => !isNaN(n))) + 1);

// Valeurs exportées : date AAAA-MM-JJ, décimales avec un point
// Import d'un CSV exporté par l'app (restauration, changement de téléphone).
// Les shots déjà présents (même date, heure et café) ne sont pas dupliqués.
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, '');
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
function importCsv(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = parseCsv(String(reader.result));
    const head = (rows.shift() || []).map((h) => norm(h));
    const col = (name) => head.indexOf(name);
    if (col('date') < 0 || col('cafe') < 0 || col('dose_g') < 0) return ask({ title: t('badFile'), body: t('badFileBody'), ok: t('ok'), cancel: '' });
    const num = (v) => parseFloat(String(v ?? '').replace(',', '.')) || 0;
    const get = (r, n) => (col(n) >= 0 ? (r[col(n)] ?? '').trim() : '');
    const key = (s) => `${s.date} ${s.heure} ${s.cafe}`;
    const known = new Set(shots.map(key));
    let added = 0;
    rows.forEach((r) => {
      const s = { date: get(r, 'date'), heure: get(r, 'heure'), cafe: get(r, 'cafe'), torrefaction: get(r, 'torrefaction'),
        dose: num(get(r, 'dose_g')), tasse: num(get(r, 'tasse_g')), temps: num(get(r, 'temps_s')), clics: num(get(r, 'clics_k6')),
        gout: get(r, 'gout'), note: get(r, 'note') };
      if (!s.date || !s.cafe || known.has(key(s))) return;
      s.id = nextId(); shots.push(s); known.add(key(s)); added++;
      if (!cafeByName(s.cafe)) cafes.push({ nom: s.cafe, torrefaction: s.torrefaction || 'moyenne', date: '' });
    });
    saveAll(); if (!F.cafe && cafes[0]) prefill(cafes[0].nom); renderAll();
    toast(added ? t('imported', { n: added }) : t('noNew'));
  };
  reader.readAsText(file);
}

function toRow(s) {
  return [s.id, s.date, s.heure, s.cafe, s.torrefaction || '', String(+Number(s.dose).toFixed(1)), Math.round(s.tasse),
    ratioOf(s).toFixed(2), s.temps, s.clics, s.gout || '', s.note || ''];
}
